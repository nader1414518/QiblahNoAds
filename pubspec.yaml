name: qiblah_no_ads
description: "Al-Qiblah & Prayer Companion - free Qiblah compass, prayer times, and Azkar."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  flutter_qiblah: ^3.2.0
  flutter_compass_v2: ^1.0.3
  geolocator: ^14.0.2
  adhan: ^2.0.0+1
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  flutter_svg: ^2.0.17
  google_fonts: ^6.2.1
  lat_lng_to_timezone: ^0.2.0
  geomag: ^0.3.0
  sensors_plus: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/compass.svg
    - assets/needle.svg
    - lib/data/cities.json
    - lib/data/azkar/morning.json
    - lib/data/azkar/evening.json
    - lib/data/azkar/post_prayer.json
